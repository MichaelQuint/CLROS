name: CLROS CI smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-smoke:
    runs-on: windows
    timeout-minutes: 150
    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build solution
        run: dotnet build .\CLROS.slnx --nologo -m:1

      - name: Run host tests
        run: dotnet run --project .\tests\OS.HostTests\OS.HostTests.csproj --no-build -- --lane full

      - name: Check naming and source firewall
        run: dotnet run --project .\tools\OS.Tooling --no-build -- repo check

      - name: Preflight EFI toolchain
        run: dotnet run --project .\tools\OS.Tooling --no-build -- efi build --preflight-only

      - name: Plan CI smoke lanes
        run: dotnet run --project .\tools\OS.Tooling --no-build -- ci smoke --dry-run

      - name: Plan baseline evidence
        run: dotnet run --project .\tools\OS.Tooling --no-build -- baseline evidence --plan-only

      - name: Check whitespace
        run: git diff --check

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clros-ci-smoke-logs
          path: artifacts/logs/**
          if-no-files-found: warn
